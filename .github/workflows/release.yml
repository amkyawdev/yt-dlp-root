name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deployable bundle
        run: bash scripts/build.sh

      - name: Package archives
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          cd dist
          tar -czf "../audiotext-extractor-${TAG}.tar.gz" .
          zip -qr "../audiotext-extractor-${TAG}.zip" .
          cd ..
          # Checksums for both archives
          sha256sum "audiotext-extractor-${TAG}.tar.gz" "audiotext-extractor-${TAG}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AudioText Extractor ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            audiotext-extractor-${{ steps.ver.outputs.tag }}.tar.gz
            audiotext-extractor-${{ steps.ver.outputs.tag }}.zip
            SHA256SUMS.txt
