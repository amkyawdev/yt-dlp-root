name: android-build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # Pin explicit packages: the legacy `tools` package was removed from
        # Google's repository, and setup-android@v3 defaults to installing it,
        # which fails the whole job.
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Assemble release APK (signed when secrets are present)
        env:
          AMKYAW_KEYSTORE_BASE64: ${{ secrets.AMKYAW_KEYSTORE_BASE64 }}
          AMKYAW_KEYSTORE_PASSWORD: ${{ secrets.AMKYAW_KEYSTORE_PASSWORD }}
          AMKYAW_KEY_ALIAS: ${{ secrets.AMKYAW_KEY_ALIAS }}
          AMKYAW_KEY_PASSWORD: ${{ secrets.AMKYAW_KEY_PASSWORD }}
        run: |
          if [ -n "$AMKYAW_KEYSTORE_BASE64" ]; then
            echo "$AMKYAW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export AMKYAW_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          rm -f "$RUNNER_TEMP/release.jks" || true
        # Signing secrets (all optional): AMKYAW_KEYSTORE_BASE64,
        # AMKYAW_KEYSTORE_PASSWORD, AMKYAW_KEY_ALIAS, AMKYAW_KEY_PASSWORD.
        # Without them the release build still succeeds, just unsigned.

      - name: Rename artifacts
        id: names
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo 1.0.0)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/audiotext-extractor-v${VERSION}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/audiotext-extractor-v${VERSION}.apk"
          fi
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audiotext-extractor-apk
          path: android/out/*

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*
          generate_release_notes: false
