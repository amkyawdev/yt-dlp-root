name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify + build bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check all JS modules
        run: |
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" >/dev/null 2>&1; then
              echo "::error file=$f::syntax error"
              node --check "$f" 2>&1 | head -3
              fail=1
            fi
          done < <(find web/js worker/src -name '*.js' | sort)
          exit $fail

      - name: Verify imports resolve
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(d) {
            return fs.readdirSync(d, { withFileTypes: true }).flatMap((e) =>
              e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
          }
          let bad = 0;
          for (const f of walk('web/js').filter((f) => f.endsWith('.js'))) {
            const src = fs.readFileSync(f, 'utf8');
            const re = /from\s+["'](\.[^"']+)["']/g;
            let m;
            while ((m = re.exec(src))) {
              const p = path.resolve(path.dirname(f), m[1]);
              if (!fs.existsSync(p)) { console.log('::error::' + f + ' -> ' + m[1]); bad++; }
            }
          }
          if (bad) process.exit(1);
          console.log('all imports resolve');
          NODE

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('assets/manifest.json','utf8')); console.log('manifest OK')"

      - name: Build deployable bundle
        run: bash scripts/build.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: audiotext-extractor-dist
          path: dist/
          retention-days: 14
