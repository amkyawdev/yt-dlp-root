name = "yt-dlp"
main = "app.js"
compatibility_date = "2024-11-01"

# ── The published application ──────────────────────────────────────────────
# This one Worker serves BOTH:
#   • the static frontend (from ../web, via the ASSETS binding)
#   • the same-origin /proxy + /health the app needs
#
# Why same-origin matters: yt-dlp runs in Pyodide and issues synchronous XHR,
# which browsers forbid cross-origin. A separate *.workers.dev origin fails
# with "Host is unreachable"; serving the proxy here avoids that entirely.
#
# Deploy:  npx wrangler deploy
# Live:    https://yt-dlp.burme-vpn.workers.dev

[assets]
directory = "../web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true
