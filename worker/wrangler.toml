name = "audiotext-extractor-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The Worker only does CORS + YouTube proxying. No bindings, no storage,
# no compute — so this config stays intentionally empty.

[observability]
enabled = true

# ── Deploy ────────────────────────────────────────────────────────────────
#   npx wrangler deploy
#
# ── Local dev ─────────────────────────────────────────────────────────────
#   npx wrangler dev --port 8787
#
# Then point the frontend at it:
#   window.AUDIOTEXT_CONFIG.workerUrl = "http://localhost:8787"
